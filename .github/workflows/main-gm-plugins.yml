name: Grant Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: nuget restore GM.Plugins.slnx

      - name: Build plugins
        run: dotnet build GM.Plugins/GM.Plugins.csproj --configuration Release --no-restore

      - name: Run plugin tests
        run: dotnet test GM.Plugin.Tests/GM.Plugin.Tests.csproj --configuration Release --no-build