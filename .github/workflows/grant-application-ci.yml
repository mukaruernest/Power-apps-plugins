name: Grant Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      # 1. Get the repository code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install the .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 3. Restore the plugin's packages.config dependencies to its HintPath directory
      - name: Restore plugin NuGet packages
        run: nuget restore GM.Plugins\packages.config -PackagesDirectory GM.Plugins\packages

      # 4. Restore the SDK-style test project
      - name: Restore test NuGet packages
        run: dotnet restore GM.Plugin.Tests\GM.Plugin.Tests.csproj

      # 5. Build the Dataverse plugins
      - name: Build plugins
        run: dotnet build GM.Plugins\GM.Plugins.csproj --configuration Release --no-restore

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm-plugins
          path: GM.Plugins\bin\Release\
  
  test:
    needs: build
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore plugin NuGet packages
        run: nuget restore GM.Plugins\packages.config -PackagesDirectory GM.Plugins\packages

      - name: Restore test NuGet packages
        run: dotnet restore GM.Plugin.Tests\GM.Plugin.Tests.csproj

      - name: Run plugin tests
        run: dotnet test GM.Plugin.Tests\GM.Plugin.Tests.csproj --configuration Release --no-restore

  codeql:
    name: CodeQL security and quality scan
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Restore plugin NuGet packages
        run: nuget restore GM.Plugins\packages.config -PackagesDirectory GM.Plugins\packages

      - name: Build plugin for CodeQL analysis
        run: dotnet build GM.Plugins\GM.Plugins.csproj --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3